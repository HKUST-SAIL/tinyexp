[tox]
skipsdist = true
envlist = py39, py310, py311, py312, py313, py314

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
passenv = PYTHON_VERSION
allowlist_externals = uv
setenv =
    RAY_ENABLE_UV_RUN_RUNTIME_ENV = 0
commands =
    uv sync --locked --python {envpython} --extra pytorch
    uv run --frozen --extra pytorch python -m pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    # mypy
